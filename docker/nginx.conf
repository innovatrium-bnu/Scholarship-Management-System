# nginx for the BNU Scholarship Management System.
#
# One origin serves both the SPA and the API. That is deliberate rather than
# convenient: same-origin means Sanctum's session cookie is a first-party cookie
# and CORS never enters the picture.
#
# This file is the development copy and is close to what the university server
# runs; the production difference is TLS and the root path.
server {
    listen 80;
    server_name _;

    # Student names and audit reasons are UTF-8, including Urdu and Punjabi.
    charset utf-8;
    client_max_body_size 20m;

    # --- API -------------------------------------------------------------
    # Everything under /api goes to Laravel's front controller. The alias makes
    # Laravel see the full "/api/..." path, so routes/api.php and the generated
    # links agree with what the browser asked for.
    location /api {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    # Sanctum's CSRF endpoint, which does not live under /api.
    #
    # Easy to miss, and it fails in the least obvious way: the SPA asks for a
    # cookie, nginx cheerfully answers with index.html and a 200, the browser
    # stores no XSRF-TOKEN, and every write is refused with a 419 that looks
    # like a CSRF bug rather than a routing one. Cookie authentication does not
    # work at all without this line.
    location /sanctum {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /var/www/api/public;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # --- SPA -------------------------------------------------------------
    # Hashed assets are immutable by construction: a change to the file changes
    # its name, so it can be cached indefinitely.
    location /assets/ {
        root /var/www/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls back to index.html so the client-side router can
    # handle deep links. Without this, reloading /students/F23-BSCS-001 is a 404.
    location / {
        root /var/www/dist;
        try_files $uri $uri/ /index.html;

        # index.html must never be cached, or browsers keep loading an old one
        # that references asset hashes the new deploy has already deleted.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
        }
    }
}
